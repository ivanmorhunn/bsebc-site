<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Local static server (e.g. npm run dev / serve) has NO /api. Either run `npm run dev:vercel`
       or set content to your deployed origin so the gallery can call the live API: -->
  <meta name="bsebc-photos-api-origin" content="" />
  <meta name="description" content="Фотогалерея — BSEBC Brookhaven" />
  <title>Фотогалерея — BSEBC</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="content.js"></script>
  <style>
    /* Gallery page — match About page visual language (scoped to this file) */
    body { padding-top: 64px; }

    /* Keep nav readable (same approach as About) */
    #nav {
      background: rgba(10,15,30,0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    /* Hero (mirrors About page hero) */
    .about-page-hero {
      background: var(--night);
      padding: 7.5rem 3.5rem 5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .about-page-hero::before {
      content: '';
      position: absolute; inset: 0;
      background-image: url('assets/church.webp');
      background-size: cover; background-position: center 30%;
      opacity: 0.15;
    }
    .about-hero-inner { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }
    .about-hero-eyebrow {
      font-size: 9px; font-weight: 600; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--gold); margin-bottom: 1.25rem;
    }
    .about-hero-inner h1 {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 4.5vw, 3.8rem);
      font-weight: 400; color: var(--white); line-height: 1.1; margin-bottom: 1rem;
    }
    .about-hero-inner h1 em { font-style: italic; color: var(--gold-light); }
    .about-hero-inner p {
      font-size: 15px; color: rgba(255,255,255,0.55); line-height: 1.75;
      max-width: 620px; margin: 0 auto;
    }

    .back-bar {
      position: absolute;
      top: 64px; left: 0; right: 0;
      z-index: 2;
      background: transparent;
      padding: 1rem 3.5rem;
      text-align: center;
    }
    .back-bar a {
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--gold); text-decoration: none;
      display: inline-flex; align-items: center; gap: 7px;
      transition: color var(--transition);
    }
    .back-bar a:hover { color: var(--gold-light); }

    /* About-like section shells */
    .abt-section { max-width: 780px; margin: 0 auto; padding: 5rem 2.5rem; }
    .abt-section-wide { max-width: 1040px; margin: 0 auto; padding: 5rem 2.5rem; }
    .abt-bg-white { background: var(--white); }
    .abt-bg-parchment {
      background:
        radial-gradient(ellipse 100% 70% at 50% -10%, rgba(255, 252, 245, 0.9) 0%, transparent 52%),
        linear-gradient(180deg, rgba(184, 145, 58, 0.06) 0%, transparent 28%),
        var(--parchment);
    }
    /* Album grid area — clean neutral “photo wall” like a classic church gallery */
    .abt-bg-parchment.gp-album-stage {
      background: #f0f0f0;
    }
    .abt-bg-parchment.gp-album-stage .gp-gallery-stage {
      /* Let thumbnails breathe: reference gallery is wide with big thumbs */
      max-width: min(1680px, 100%);
      margin: 0 auto;
      padding: clamp(1.25rem, 3vw, 2.25rem) clamp(0.35rem, 1.5vw, 1rem)
        clamp(2.5rem, 5vw, 4rem);
    }

    /* Album view: full-bleed dense thumb wall (no hero banner — avoids awkward crops) */
    body.gp-view-album .abt-bg-parchment.gp-album-stage .gp-gallery-stage {
      max-width: 100%;
      /* Add padding around the thumbnail wall (matches reference) */
      padding: clamp(0.9rem, 2.4vw, 1.6rem) clamp(0.9rem, 2.4vw, 1.6rem)
        clamp(2.2rem, 4vw, 3.4rem);
    }

    .abt-section h2 {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 400; color: var(--night);
      line-height: 1.15; margin-bottom: 1.5rem;
    }
    .abt-section h2 em { font-style: italic; color: var(--gold); }

    .abt-body p {
      font-size: 15px; font-weight: 300; line-height: 1.85;
      color: var(--stone); margin-bottom: 1.1rem;
    }
    .abt-body p:last-child { margin-bottom: 0; }

    /* Year + album controls — pill “timeline” */
    .year-nav {
      display: flex;
      gap: 0.45rem;
      justify-content: center;
      flex-wrap: wrap;
      padding: 1.5rem 0 0.35rem;
    }
    .year-btn {
      padding: 0.65rem 1.35rem;
      font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--stone);
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(184, 145, 58, 0.22);
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--sans);
      box-shadow: 0 2px 14px rgba(10, 15, 30, 0.04);
      transition: background var(--transition), border-color var(--transition), color var(--transition), transform 0.25s ease, box-shadow 0.25s ease;
    }
    .year-btn:hover {
      color: var(--night);
      border-color: rgba(184, 145, 58, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(10, 15, 30, 0.08);
    }
    .year-btn.active {
      color: var(--night);
      background: linear-gradient(165deg, rgba(255, 248, 230, 0.95), rgba(184, 145, 58, 0.2));
      border-color: rgba(184, 145, 58, 0.55);
      box-shadow: 0 4px 20px rgba(184, 145, 58, 0.15);
    }

    .gp-folder-trail-wrap {
      margin-top: 1.15rem;
      text-align: center;
    }
    .gp-folder-trail-wrap.gp-folder-trail-wrap--hidden {
      display: none;
    }
    .gp-folder-trail-toolbar {
      display: flex;
      justify-content: center;
      margin-bottom: 0.55rem;
    }
    .gp-folder-trail-toolbar:empty {
      display: none;
    }
    .gp-folder-up {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 1rem;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--night);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(184, 145, 58, 0.45);
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(10, 15, 30, 0.06);
      transition: background var(--transition), border-color var(--transition), transform 0.2s ease;
    }
    .gp-folder-up:hover {
      background: rgba(255, 250, 235, 0.98);
      border-color: rgba(184, 145, 58, 0.65);
      transform: translateY(-1px);
    }
    .gp-folder-trail {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.2rem 0.35rem;
      max-width: 100%;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      color: var(--stone);
      line-height: 1.5;
    }
    .gp-folder-trail .gp-trail-sep {
      color: rgba(10, 15, 30, 0.22);
      user-select: none;
      padding: 0 0.05rem;
      font-weight: 700;
      font-size: 0.92em;
    }
    /* Breadcrumb pills (match folder chip style) */
    .gp-folder-trail .gp-trail-pill {
      appearance: none;
      border: 1px solid rgba(10, 15, 30, 0.12);
      background: rgba(255, 255, 255, 0.75);
      color: rgba(10, 15, 30, 0.78);
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 650;
      padding: 0.55rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      max-width: min(100%, 320px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(10, 15, 30, 0.04);
      transition: transform 0.2s ease, background var(--transition), border-color var(--transition), color var(--transition), box-shadow 0.2s ease;
    }
    .gp-folder-trail button.gp-trail-pill:hover {
      transform: translateY(-1px);
      border-color: rgba(184, 145, 58, 0.42);
      color: var(--night);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 20px rgba(10, 15, 30, 0.07);
    }
    .gp-folder-trail .gp-trail-current.gp-trail-pill {
      cursor: pointer;
      transform: none;
      color: var(--night);
      border-color: rgba(184, 145, 58, 0.55);
      background: linear-gradient(165deg, rgba(255, 248, 230, 0.95), rgba(184, 145, 58, 0.18));
      box-shadow: 0 4px 18px rgba(184, 145, 58, 0.12);
    }
    .gp-folder-trail .gp-trail-current.gp-trail-pill:hover {
      transform: none;
    }

    .folder-nav-wrap {
      display: none;
      margin-top: 0.85rem;
      text-align: center;
    }
    .folder-nav-wrap.is-visible { display: block; }
    .folder-nav--children {
      gap: 0.35rem;
    }
    .folder-nav--children .folder-btn--drill {
      padding: 0.42rem 0.95rem;
      font-size: 12px;
      font-weight: 600;
    }
    .folder-nav-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.85rem;
      opacity: 0.92;
    }
    .folder-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: center;
      align-items: center;
    }
    .folder-btn {
      padding: 0.55rem 1.2rem;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--stone);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(10, 15, 30, 0.1);
      border-radius: 999px;
      cursor: pointer;
      font-family: var(--sans);
      max-width: min(100%, 320px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(10, 15, 30, 0.04);
      transition: background var(--transition), border-color var(--transition), color var(--transition), transform 0.2s ease, box-shadow 0.2s ease;
    }
    .folder-btn:hover {
      color: var(--night);
      border-color: rgba(184, 145, 58, 0.42);
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(10, 15, 30, 0.07);
    }
    .folder-btn.active {
      color: var(--night);
      border-color: rgba(184, 145, 58, 0.48);
      background: linear-gradient(165deg, rgba(255, 250, 235, 0.98), rgba(184, 145, 58, 0.16));
      box-shadow: 0 4px 18px rgba(184, 145, 58, 0.12);
    }
    .folder-btn.folder-btn--drill {
      border-style: dashed;
      background: rgba(255, 255, 255, 0.55);
      color: var(--night);
    }
    .folder-btn.folder-btn--drill::before {
      content: "› ";
      opacity: 0.65;
      font-weight: 700;
      margin-right: 0.08em;
    }
    .folder-btn.folder-btn--drill:hover {
      border-style: solid;
      background: rgba(255, 252, 242, 0.98);
    }

    .gp-grid-shell {
      display: none;
      background: rgba(10, 15, 30, 0.1);
      border-radius: 0;
      overflow: hidden;
    }
    /* Dense tiled grid — thin “mortar” lines between cells */
    .gp-grid {
      display: grid;
      /* auto-fit collapses “empty columns” so partial rows still fill width */
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1px;
      width: 100%;
      margin: 0;
      align-content: start;
    }
    @media (min-width: 520px) {
      .gp-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
    }
    @media (min-width: 720px) {
      .gp-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
    }

    .gp-tile {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      background: #1a2133;
      border-radius: 0;
      border: none;
      box-shadow: none;
      transition: box-shadow 0.25s ease;
    }
    .gp-tile:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }
    .gp-tile:hover {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }
    .gp-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      opacity: 0;
    }
    .gp-tile img.loaded {
      opacity: 1;
    }
    .gp-tile:hover img {
      transform: scale(1.05);
    }
    .gp-tile-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.55rem;
      font-family: var(--sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: none;
      color: rgba(255, 255, 255, 0.96);
      background: rgba(10, 15, 30, 0.52);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      line-height: 1.25;
    }
    .gp-tile-caption-icon {
      flex: 0 0 auto;
      display: flex;
      color: rgba(255, 255, 255, 0.88);
    }
    .gp-tile-caption-icon svg {
      display: block;
    }
    .gp-tile-caption-text {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Album view: big “wall” thumbnails (like reference) */
    body.gp-view-album .gp-grid-shell {
      display: block;
      background: transparent;
    }
    body.gp-view-album .gp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: clamp(8px, 1.15vw, 14px);
    }
    @media (min-width: 520px) {
      body.gp-view-album .gp-grid {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
    }
    @media (min-width: 900px) {
      body.gp-view-album .gp-grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    }
    @media (min-width: 1300px) {
      body.gp-view-album .gp-grid {
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      }
    }
    body.gp-view-album .gp-tile {
      aspect-ratio: 4 / 3;
    }
    body.gp-view-album .gp-tile img {
      opacity: 1;
    }
    body.gp-view-album .gp-tile img.loaded {
      opacity: 1;
    }
    body.gp-view-album .gp-tile-caption {
      display: none;
    }

    /* Loading state */
    .gp-loading {
      text-align: center; padding: 5rem 2rem;
      color: var(--stone); font-size: 14px;
    }
    .gp-loading-spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 2px solid var(--gold-pale);
      border-top-color: var(--gold);
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .gp-empty {
      text-align: center; padding: 5rem 2rem;
      color: var(--stone);
    }
    .gp-empty h3 {
      font-family: var(--serif); font-size: 1.5rem;
      font-weight: 400; color: var(--night); margin-bottom: .5rem;
    }
    .gp-empty h3:empty { display: none; }

    /* Lightbox */
    .lb-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 1200;
      background: rgba(5, 7, 15, 0.96);
      align-items: center; justify-content: center;
    }
    .lb-overlay.open { display: flex; }
    .lb-img-wrap {
      position: relative;
      max-width: 90vw; max-height: 88vh;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-img {
      max-width: 90vw; max-height: 85vh;
      object-fit: contain; display: block;
      border: 1px solid rgba(184,145,58,0.15);
    }
    .lb-close {
      position: fixed; top: 1.5rem; right: 2rem;
      font-size: 28px; color: rgba(255,255,255,0.6);
      cursor: pointer; background: none; border: none;
      font-family: var(--sans); line-height: 1;
      transition: color var(--transition);
      z-index: 1201;
    }
    .lb-close:hover { color: var(--white); }
    .lb-prev, .lb-next {
      position: fixed; top: 50%; transform: translateY(-50%);
      font-size: 28px; color: rgba(255,255,255,0.5);
      cursor: pointer; background: rgba(10,15,30,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 2px;
      padding: 1rem 1.25rem;
      font-family: var(--sans); line-height: 1;
      transition: color var(--transition), background var(--transition);
      z-index: 1201;
    }
    .lb-prev:hover, .lb-next:hover {
      color: var(--white); background: rgba(10,15,30,0.85);
    }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    .lb-counter {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }
    .lb-download {
      position: fixed;
      bottom: 3.4rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1201;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0.65rem 1.35rem;
      border: 1px solid rgba(184,145,58,0.45);
      border-radius: 2px;
      background: rgba(10,15,30,0.72);
      color: var(--gold);
      cursor: pointer;
      font-family: var(--sans);
      transition: color var(--transition), background var(--transition), border-color var(--transition);
    }
    .lb-download:hover {
      background: rgba(10,15,30,0.92);
      color: var(--gold-light);
      border-color: rgba(184,145,58,0.7);
    }
    .lb-download:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }
    .lb-download:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    @media (max-width: 700px) {
      .about-page-hero { padding: 6.75rem 1.5rem 4rem; }
      .back-bar { padding: 0.9rem 1.5rem; top: 64px; }
      .abt-section, .abt-section-wide { padding: 3.5rem 1.5rem; }
      .abt-bg-parchment.gp-album-stage .gp-gallery-stage {
        padding: 1.5rem 0.35rem 2.75rem;
      }
      .gp-tile-caption {
        font-size: 9px;
        padding: 0.4rem 0.45rem;
      }
      .gp-grid {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      .lb-prev { padding: 0.75rem 0.9rem; }
      .lb-next { padding: 0.75rem 0.9rem; }
      .lb-download {
        bottom: 3.1rem;
        padding: 0.55rem 1rem;
        font-size: 10px;
      }
    }
  </style>
</head>

<script>
// ── CONFIG ────────────────────────────────────────────
const CLOUD_NAME = 'dboyuj209';
// Photo lists: `/api/photos` (same host on Vercel, or see meta bsebc-photos-api-origin / __BSEBC_PHOTOS_API__).
// Thumbnails/full images still use Cloudinary delivery URLs (CLOUD_NAME) below.
let YEARS = [];
let currentYear = '';
/** Full Cloudinary asset_folder path for the current view (e.g. `2024`, `2024/Разное/Разное 2`). */
let currentAssetPath = '';
/** @type {Map<string, string[]>} folder key → public_ids (key "" = assets directly in currentAssetPath) */
let folderGroups = new Map();
let photos = [];
let lbIndex = 0;
let lang = localStorage.getItem('bsebc-lang') || 'ru';
// Cache: year -> top-level folders (so folder opens don't block on an extra fetch)
const topFoldersByYearCache = new Map();

// ── CLOUDINARY ────────────────────────────────────────
function cloudUrl(publicId, opts = '') {
  return `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${opts}${publicId}`;
}

function thumbUrl(publicId) {
  return cloudUrl(publicId, 'w_1100,h_825,c_fill,q_auto,f_auto/');
}

function fullUrl(publicId) {
  return cloudUrl(publicId, 'w_2000,q_auto,f_auto/');
}

function downloadAttachmentUrl(publicId, index) {
  const yearRoot = (currentAssetPath || currentYear).split('/')[0] || currentYear;
  const base = `BSEBC_${yearRoot}_${String(index + 1).padStart(3, '0')}`;
  // Same delivery host as thumbnails; `fl_attachment` sets Content-Disposition: attachment.
  // Do not use `f_original` here — it is not a valid image format token in the URL API and returns 400.
  // Do not use `f_auto` here — it prefers WebP/AVIF; omitting `f_*` keeps the uploaded format (Cloudinary default).
  return cloudUrl(publicId, `fl_attachment:${base}/q_100,w_2800,c_limit/`);
}

/**
 * Trigger a real file save. We avoid fetch→blob→<a download> because after `await`
 * the browser no longer treats the click as a user gesture, so `download` is ignored
 * and you only get a blob: URL navigation.
 * Cloudinary `fl_attachment` sends Content-Disposition: attachment; a hidden iframe
 * starts the download without leaving the gallery page.
 */
function downloadPhotoByIndex(index) {
  if (!photos.length || index < 0 || index >= photos.length) return;
  const id = photos[index];
  const url = downloadAttachmentUrl(id, index);

  const iframe = document.createElement('iframe');
  iframe.setAttribute('aria-hidden', 'true');
  iframe.style.cssText = 'position:fixed;width:0;height:0;border:0;opacity:0;pointer-events:none;';
  iframe.src = url;
  document.body.appendChild(iframe);

  window.setTimeout(() => {
    try { iframe.remove(); } catch (_) {}
  }, 300000);
}

function downloadGalleryPhoto(ev) {
  if (ev && typeof ev.stopPropagation === 'function') ev.stopPropagation();
  downloadPhotoByIndex(lbIndex);
}

/** Base URL for `/api/photos` (no trailing slash). Empty = same origin (Vercel production). */
function getPhotosApiBase() {
  if (typeof window === 'undefined') return '';
  if (window.__BSEBC_PHOTOS_API__) {
    return String(window.__BSEBC_PHOTOS_API__).replace(/\/$/, '');
  }
  const meta = document.querySelector('meta[name="bsebc-photos-api-origin"]');
  if (meta) {
    const c = (meta.getAttribute('content') || '').trim();
    if (c) return c.replace(/\/$/, '');
  }
  return '';
}

async function fetchYears() {
  const apiBase = getPhotosApiBase();
  const res = await fetch(`${apiBase}/api/years`);
  if (!res.ok) return [];
  const data = await res.json().catch(() => ({}));
  if (!data || !Array.isArray(data.years)) return [];
  return data.years.map(String).filter(Boolean);
}

/**
 * `/api/photos` returns { folders: { General: [...ids], AlbumName: [...] } } (see api/photos.js).
 * "General" = assets in the requested folder path; mapped to key "" (photos for the current path).
 * Empty arrays are kept so nested folders without direct uploads still appear in the nav.
 */
function foldersResponseToMap(foldersObj) {
  const map = new Map();
  if (!foldersObj || typeof foldersObj !== 'object') return map;
  Object.entries(foldersObj).forEach(([name, ids]) => {
    if (!Array.isArray(ids)) return;
    const key = name === 'General' ? '' : name;
    map.set(key, ids.slice());
  });
  return map;
}

function sortedFolderKeys(map) {
  return [...map.keys()].sort((a, b) => {
    if (a === b) return 0;
    if (a === '') return -1;
    if (b === '') return 1;
    return a.localeCompare(b, undefined, { sensitivity: 'base' });
  });
}

function assetPathSegments() {
  return String(currentAssetPath || '')
    .split('/')
    .map((s) => s.trim())
    .filter(Boolean);
}

function tileCaptionLabel() {
  const parts = assetPathSegments();
  if (!parts.length) return '';
  if (parts.length === 1) return parts[0];
  return parts.slice(1).join(' · ');
}

function isAlbumView() {
  return assetPathSegments().length > 1;
}

function setPhotoGridVisible(visible) {
  const shell = document.getElementById('gp-grid-shell');
  const g = document.getElementById('gp-grid');
  if (g) g.style.display = visible ? 'grid' : 'none';
  if (shell) shell.style.display = visible ? 'block' : 'none';
}

function galleryPhotoChipSvg() {
  return (
    '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
    '<path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM5 19l4.5-5.31 2.16 2.59L14 12l5 7H5zm2.5-9.5c-.83 0-1.5-.67-1.5-1.5S6.67 6 7.5 6 9 6.67 9 7.5 8.33 9 7.5 9 6.67 8.33 6 7.5 6z"/>' +
    '</svg>'
  );
}

function joinAssetPath(base, segment) {
  const b = String(base || '').replace(/\/+$/, '');
  const s = String(segment || '').replace(/^\/+|\/+$/g, '');
  if (!s) return b;
  return b ? `${b}/${s}` : s;
}

function parentAssetPath(p) {
  const parts = String(p || '')
    .split('/')
    .map((s) => s.trim())
    .filter(Boolean);
  parts.pop();
  return parts.join('/');
}

function syncYearFromAssetPath() {
  const root = assetPathSegments()[0];
  if (root && YEARS.includes(root)) currentYear = root;
}

function goUpOneFolder() {
  const p = parentAssetPath(currentAssetPath);
  if (!p) return;
  currentAssetPath = p;
  loadPhotos();
}

function renderFolderTrail() {
  const wrap = document.getElementById('gp-folder-trail-wrap');
  const toolbar = document.getElementById('gp-folder-trail-toolbar');
  const nav = document.getElementById('gp-folder-trail');
  if (!wrap || !nav) return;
  const G = CONTENT.galleryPage || {};
  const parts = assetPathSegments();
  // Show breadcrumbs only when nested deeper than year/folder.
  // (Year + active folder are already represented by the year pills + sibling folder chips.)
  if (parts.length <= 2) {
    wrap.classList.add('gp-folder-trail-wrap--hidden');
    if (toolbar) toolbar.innerHTML = '';
    nav.innerHTML = '';
    return;
  }
  wrap.classList.remove('gp-folder-trail-wrap--hidden');
  nav.setAttribute('aria-label', t(G.folderTrailAria) || '');
  // Breadcrumbs are the navigation; avoid adding a separate "Back" button row.
  if (toolbar) toolbar.innerHTML = '';
  nav.innerHTML = '';
  const yearRoot = parts[0];
  const trailParts = parts.slice(1); // avoid duplicating the year pill
  trailParts.forEach((label, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'gp-trail-sep';
      sep.textContent = '›';
      sep.setAttribute('aria-hidden', 'true');
      nav.appendChild(sep);
    }
    if (i < trailParts.length - 1) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'gp-trail-pill';
      btn.textContent = label;
      btn.title = label;
      btn.addEventListener('click', () => {
        currentAssetPath = [yearRoot, ...trailParts.slice(0, i + 1)].join('/');
        loadPhotos();
      });
      nav.appendChild(btn);
    } else {
      const cur = document.createElement('button');
      cur.type = 'button';
      cur.className = 'gp-trail-current gp-trail-pill';
      cur.textContent = label;
      cur.title = label;
      cur.addEventListener('click', () => {
        currentAssetPath = [yearRoot, ...trailParts].join('/');
        loadPhotos();
      });
      nav.appendChild(cur);
    }
  });
}

async function fetchTopFoldersForYear(year) {
  const y = String(year || '').trim();
  if (!y) return [];
  if (topFoldersByYearCache.has(y)) return topFoldersByYearCache.get(y) || [];
  try {
    const apiBase = getPhotosApiBase();
    const res = await fetch(`${apiBase}/api/photos?folder=${encodeURIComponent(y)}`);
    const data = await res.json().catch(() => ({}));
    const map = foldersResponseToMap(data && data.folders);
    const keys = sortedFolderKeys(map).filter((k) => k !== '');
    topFoldersByYearCache.set(y, keys);
    return keys;
  } catch (_) {
    topFoldersByYearCache.set(y, []);
    return [];
  }
}

function buildSiblingFolderNav(keys) {
  const wrap = document.getElementById('folder-sibling-nav-wrap');
  const nav = document.getElementById('folder-sibling-nav');
  if (!wrap || !nav) return;

  const parts = assetPathSegments();
  const yearRoot = parts[0] || currentYear;
  const active = parts[1] || '';

  // Only show this bar once you are inside a folder.
  if (parts.length < 2) {
    nav.innerHTML = '';
    wrap.classList.remove('is-visible');
    return;
  }

  wrap.classList.add('is-visible');
  nav.innerHTML = '';
  const G = CONTENT.galleryPage || {};
  nav.setAttribute('aria-label', t(G.folderNavToolbarAria) || '');

  const list = Array.isArray(keys) && keys.length ? keys : active ? [active] : [];
  list.forEach((key) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'folder-btn folder-btn--drill' + (key === active ? ' active' : '');
    btn.dataset.folder = key;
    btn.textContent = key;
    btn.title =
      lang === 'ru'
        ? `Открыть папку «${key}»`
        : `Open folder “${key}”`;
    btn.addEventListener('click', () => {
      currentAssetPath = joinAssetPath(yearRoot, key);
      loadPhotos();
    });
    nav.appendChild(btn);
  });
}

function syncYearNavButtons() {
  const root = assetPathSegments()[0] || currentYear;
  document.querySelectorAll('.year-btn').forEach((b) => {
    b.classList.toggle('active', b.textContent === root);
  });
}

function buildFolderNav(keys) {
  const wrap = document.getElementById('folder-nav-wrap');
  const nav = document.getElementById('folder-nav');
  if (!wrap || !nav) return;

  const reset = () => {
    nav.innerHTML = '';
    wrap.classList.remove('is-visible');
  };

  const childKeys = (keys || []).filter((k) => k !== '');
  if (!childKeys.length) {
    reset();
    return;
  }

  wrap.classList.add('is-visible');
  nav.innerHTML = '';
  const G = CONTENT.galleryPage || {};
  nav.setAttribute('aria-label', t(G.folderNavToolbarAria) || '');

  childKeys.forEach((key) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'folder-btn folder-btn--drill';
    btn.dataset.folder = key;
    btn.textContent = key;
    btn.title =
      lang === 'ru'
        ? `Открыть папку «${key}»`
        : `Open folder “${key}”`;
    btn.addEventListener('click', () => {
      currentAssetPath = joinAssetPath(currentAssetPath, key);
      loadPhotos();
    });
    nav.appendChild(btn);
  });
}

function refreshFolderNavFromI18n() {
  const wrap = document.getElementById('folder-nav-wrap');
  if (!wrap || !wrap.classList.contains('is-visible')) return;
  const G = CONTENT.galleryPage || {};
  const nav = document.getElementById('folder-nav');
  if (nav) nav.setAttribute('aria-label', t(G.folderNavToolbarAria) || '');
  document.querySelectorAll('#folder-nav .folder-btn').forEach((btn) => {
    const key = btn.dataset.folder;
    if (!key) return;
    btn.textContent = key;
    btn.title =
      lang === 'ru'
        ? `Открыть папку «${key}»`
        : `Open folder “${key}”`;
  });
}

function renderPhotoGrid() {
  const grid = document.getElementById('gp-grid');
  const empty = document.getElementById('gp-empty');
  if (!grid || !empty) return;

  grid.innerHTML = '';

  if (!photos.length) {
    document.body.classList.remove('gp-view-album');
    setPhotoGridVisible(false);
    const hasChildFolders = sortedFolderKeys(folderGroups).some((k) => k !== '');
    const G = CONTENT.galleryPage || {};
    if (hasChildFolders) {
      // If root has no direct photos but has albums, show just the folders UI (no empty message).
      empty.style.display = 'none';
      return;
    } else {
      renderGalleryEmptyState();
    }
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  setPhotoGridVisible(true);

  const pathBit = currentAssetPath ? `${currentAssetPath.replace(/\//g, ' · ')} · ` : '';
  const cap = tileCaptionLabel();
  const capSafe = escapeHtml(cap);
  const chipSvg = galleryPhotoChipSvg();
  const albumMode = isAlbumView();
  document.body.classList.toggle('gp-view-album', albumMode);

  photos.forEach((id, i) => {
    const tile = document.createElement('div');
    tile.className = 'gp-tile';
    tile.setAttribute('role', 'button');
    tile.setAttribute('tabindex', '0');
    const alt =
      (lang === 'ru' ? 'Фото' : 'Photo') +
      ` ${i + 1} · ${pathBit}`;
    if (albumMode) {
      tile.innerHTML = `
        <img src="${thumbUrl(id)}" alt="${alt.replace(/"/g, '&quot;')}" loading="lazy" onload="this.classList.add('loaded')" />
      `;
    } else {
      tile.innerHTML = `
        <img src="${thumbUrl(id)}" alt="${alt.replace(/"/g, '&quot;')}" loading="lazy" onload="this.classList.add('loaded')" />
        <div class="gp-tile-caption">
          <span class="gp-tile-caption-icon">${chipSvg}</span>
          <span class="gp-tile-caption-text">${capSafe}</span>
        </div>
      `;
    }
    tile.onclick = () => openGpLightbox(i);
    tile.onkeydown = (ev) => {
      if (ev.key === 'Enter' || ev.key === ' ') {
        ev.preventDefault();
        openGpLightbox(i);
      }
    };
    grid.appendChild(tile);
  });
}

async function loadPhotos() {
  const grid = document.getElementById('gp-grid');
  const loading = document.getElementById('gp-loading');
  const empty = document.getElementById('gp-empty');

  document.body.classList.remove('gp-view-album');
  setPhotoGridVisible(false);
  empty.style.display = 'none';
  loading.style.display = 'block';

  try {
    const apiBase = getPhotosApiBase();
    const res = await fetch(
      `${apiBase}/api/photos?folder=${encodeURIComponent(currentAssetPath)}`,
    );
    let data = {};
    try {
      data = await res.json();
    } catch (_) {
      data = {};
    }
    if (!res.ok || (data && data.error)) {
      const detail =
        (data && data.error && String(data.error)) ||
        `${res.status} ${res.statusText || ''}`.trim();
      if (typeof console !== 'undefined' && console.warn) {
        console.warn('[gallery photos]', detail);
      }
      loading.style.display = 'none';
      setPhotoGridVisible(false);
      folderGroups = new Map();
      photos = [];
      buildFolderNav([]);
      renderFolderTrail();
      syncYearNavButtons();
      renderGalleryEmptyState();
      empty.style.display = 'block';
      return;
    }

    folderGroups = foldersResponseToMap(data.folders);
    const keys = sortedFolderKeys(folderGroups);
    const totalCount = [...folderGroups.values()].reduce((n, arr) => n + arr.length, 0);
    const hasChildFolders = keys.some((k) => k !== '');
    // If we're at the year root, cache its top-level folders for instant sibling nav.
    if (assetPathSegments().length === 1) {
      topFoldersByYearCache.set(currentAssetPath, keys.filter((k) => k !== ''));
    }

    loading.style.display = 'none';
    syncYearFromAssetPath();
    const parts = assetPathSegments();
    const yearRoot = parts[0] || currentYear;
    // When inside a folder, keep the year’s top-level folders visible (sibling nav).
    if (yearRoot && parts.length >= 2) {
      // Render immediately from cache (or at least active) to avoid flicker.
      buildSiblingFolderNav(topFoldersByYearCache.get(yearRoot) || []);
      // Don't block folder load on this extra fetch; update chips when ready.
      void fetchTopFoldersForYear(yearRoot).then(buildSiblingFolderNav);
    } else {
      buildSiblingFolderNav([]);
    }
    renderFolderTrail();
    syncYearNavButtons();

    if (totalCount === 0 && !hasChildFolders) {
      photos = [];
      folderGroups = new Map();
      buildFolderNav([]);
      setPhotoGridVisible(false);
      renderGalleryEmptyState();
      empty.style.display = 'block';
      return;
    }

    photos = folderGroups.get('') || [];

    buildFolderNav(keys);
    renderPhotoGrid();
  } catch (e) {
    if (typeof console !== 'undefined' && console.warn) {
      console.warn('[gallery photos]', e);
    }
    loading.style.display = 'none';
    setPhotoGridVisible(false);
    folderGroups = new Map();
    photos = [];
    buildFolderNav([]);
    buildSiblingFolderNav([]);
    renderFolderTrail();
    syncYearNavButtons();
    renderGalleryEmptyState();
    empty.style.display = 'block';
  }
}

// ── YEAR TABS ─────────────────────────────────────────
function buildYearNav() {
  const nav = document.getElementById('year-nav');
  nav.innerHTML = '';
  const root = assetPathSegments()[0] || currentYear;
  YEARS.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'year-btn' + (y === root ? ' active' : '');
    btn.textContent = y;
    btn.onclick = () => {
      currentYear = y;
      currentAssetPath = y;
      document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadPhotos();
    };
    nav.appendChild(btn);
  });
}

// ── LIGHTBOX ──────────────────────────────────────────
function openGpLightbox(i) {
  lbIndex = i;
  document.getElementById('lb-img').src = fullUrl(photos[i]);
  document.getElementById('lb-counter').textContent = `${i+1} / ${photos.length}`;
  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeGpLightbox(ev) {
  if (ev && typeof ev.stopPropagation === 'function') ev.stopPropagation();
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
}

function closeLB(e) {
  if (e.target === document.getElementById('lb')) closeGpLightbox();
}

function lbNav(dir) {
  if (!photos.length) return;
  lbIndex = (lbIndex + dir + photos.length) % photos.length;
  document.getElementById('lb-img').src = fullUrl(photos[lbIndex]);
  document.getElementById('lb-counter').textContent = `${lbIndex+1} / ${photos.length}`;
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeGpLightbox(e);
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'd' || e.key === 'D') {
    e.preventDefault();
    downloadGalleryPhoto(e);
  }
});

function setLang(l) {
  if (lang === l) return;
  if (document.body.classList.contains('lang-switching')) return;

  normalizeLetterSwap();
  const before = snapshotSimpleText();
  document.body.classList.add('lang-switching','lang-lettering');
  window.setTimeout(() => {
    lang = l;
    localStorage.setItem('bsebc-lang', l);
    document.querySelectorAll('.lang-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === l));
    const langWrap = document.querySelector('.nav-lang');
    if (langWrap) langWrap.classList.toggle('is-en', l === 'en');
    document.documentElement.lang = l === 'ru' ? 'ru' : 'en';
    renderNav();
    renderGalleryChrome();
    const emptyEl = document.getElementById('gp-empty');
    if (photos.length === 0 && emptyEl && emptyEl.style.display !== 'none') {
      renderPhotoGrid();
    }
    animateTextDiff(before);
    window.setTimeout(() => {
      document.body.classList.remove('lang-switching','lang-lettering');
    }, 320);
  }, 110);
}

function normalizeLetterSwap() {
  document.querySelectorAll('.letter-swap').forEach(el => {
    const plain = el.getAttribute('data-plain-text') || (el.textContent || '');
    el.classList.remove('letter-swap','is-in','is-out');
    el.removeAttribute('data-plain-text');
    el.style.removeProperty('minWidth');
    el.textContent = plain;
  });
}

function snapshotSimpleText() {
  const items = [];
  const ids = [
    'gp-back-link',
    'gp-hero-eyebrow',
    'gp-hero-title',
    'gp-hero-sub',
    'gp-section-kicker',
    'gp-section-title',
    'gp-section-lead',
    'gp-loading-text',
    'gp-empty-title',
    'gp-empty-body',
  ];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!(el instanceof HTMLElement)) return;
    const txt = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!txt) return;
    if (txt.length < 3) return;
    items.push({ el, txt });
  });
  return items;
}

function animateTextDiff(before) {
  if (!before || !Array.isArray(before)) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  before.forEach(({ el, txt: oldTxt }) => {
    if (!el || !(el instanceof HTMLElement)) return;
    const newTxt = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!newTxt || newTxt === oldTxt) return;
    if (!isInViewport(el, 140)) return;

    const finalHTML = el.innerHTML;
    if (oldTxt.length > 140 || newTxt.length > 140) {
      longFade(el, oldTxt, finalHTML);
      return;
    }
    letterMorph(el, oldTxt, newTxt, finalHTML);
  });
}

function isInViewport(el, pad = 0) {
  const r = el.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight || 0;
  return r.bottom >= -pad && r.top <= vh + pad;
}

function longFade(el, oldTxt, finalHTML) {
  const oldText = String(oldTxt || '');
  const newHTML = typeof finalHTML === 'string' ? finalHTML : null;

  if (oldText) el.textContent = oldText;

  el.style.willChange = 'opacity, transform, filter';
  el.style.transition = 'opacity 220ms ease, transform 260ms cubic-bezier(.16,1,.3,1), filter 260ms ease';
  el.style.opacity = '1';
  el.style.transform = 'translateY(0px)';
  el.style.filter = 'blur(0px)';

  el.getBoundingClientRect();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(-4px)';
    el.style.filter = 'blur(2px)';
  }));

  window.setTimeout(() => {
    if (newHTML != null) el.innerHTML = newHTML;

    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    el.style.filter = 'blur(2px)';

    el.getBoundingClientRect();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.opacity = '1';
      el.style.transform = 'translateY(0px)';
      el.style.filter = 'blur(0px)';
    }));
  }, 230);

  window.setTimeout(() => {
    el.style.willChange = '';
    el.style.transition = '';
    el.style.opacity = '';
    el.style.transform = '';
    el.style.filter = '';
  }, 600);
}

function letterMorph(el, oldText, newText, finalHTML) {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    if (typeof finalHTML === 'string') el.innerHTML = finalHTML;
    else el.textContent = newText;
    return;
  }

  const oldLetters = Array.from(String(oldText));
  const newLetters = Array.from(String(newText));
  const w = el.getBoundingClientRect().width;
  if (w) el.style.minWidth = `${Math.ceil(w)}px`;

  el.classList.add('letter-swap');
  el.setAttribute('data-plain-text', String(newText));

  const makeLetter = (ch) => {
    const s = document.createElement('span');
    s.className = 'letter';
    s.innerHTML = escapeHtml(ch);
    const dx = (Math.random() * 26 - 13).toFixed(1);
    const dy = (Math.random() * 22 - 18).toFixed(1);
    const rot = (Math.random() * 28 - 14).toFixed(1);
    s.style.setProperty('--dx', `${dx}px`);
    s.style.setProperty('--dy', `${dy}px`);
    s.style.setProperty('--rot', `${rot}deg`);
    return s;
  };

  const renderWords = (text) => {
    el.innerHTML = '';
    const frag = document.createDocumentFragment();
    const letters = [];
    const parts = String(text).split(/(\s+)/);
    let letterIdx = 0;
    parts.forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) {
        frag.appendChild(document.createTextNode(part));
        return;
      }
      const word = document.createElement('span');
      word.className = 'letter-word';
      Array.from(part).forEach(ch => {
        const letter = makeLetter(ch === ' ' ? '\u00A0' : ch);
        word.appendChild(letter);
        letter.style.transitionDelay = `${Math.min(260, letterIdx * 12)}ms`;
        letters.push(letter);
        letterIdx++;
      });
      frag.appendChild(word);
    });
    el.appendChild(frag);
    return letters;
  };

  const outLetters = renderWords(oldText);
  outLetters.forEach((s, i) => {
    s.style.transitionDelay = `${Math.min(160, i * 8)}ms`;
  });

  requestAnimationFrame(() => {
    el.classList.remove('is-in');
    el.classList.add('is-out');
  });

  window.setTimeout(() => {
    el.classList.remove('is-out');
    const inSpans = renderWords(newText);
    inSpans.forEach((s) => {
      s.style.opacity = '0';
      s.style.transform = 'translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.96)';
      s.style.filter = 'blur(3px)';
    });

    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.add('is-in');
      inSpans.forEach(s => {
        s.style.opacity = '1';
        s.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
        s.style.filter = 'blur(0px)';
      });
    }));

    window.setTimeout(() => {
      el.classList.remove('letter-swap','is-in','is-out');
      el.style.removeProperty('minWidth');
      if (typeof finalHTML === 'string') el.innerHTML = finalHTML;
      else el.textContent = String(newText);
      el.removeAttribute('data-plain-text');
    }, 900);
  }, 240);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

document.body.classList.add('page-enter');

});
document.addEventListener('click', (e) => {
  const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
  if (!a) return;
  const href = a.getAttribute('href') || '';
  if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
  if (a.target && a.target !== '_self') return;
  const url = new URL(a.href, window.location.href);
  if (url.origin !== window.location.origin) return;
  if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;
  e.preventDefault();
  document.body.classList.add('page-leave');
  window.setTimeout(() => { window.location.href = url.href; }, 180);
});
