backend:
  branch: main
  name: git-gateway

media_folder: assets
public_folder: assets

collections:
  - name: "schedule"
    label: "Service Schedule"
    label_singular: "Day"
    folder: "_schedule"
    create: false
    files:
      - label: "Sunday"
        name: "sunday"
        file: "_data/sunday.json"
        fields:
          - { label: "Services", name: "services", widget: "list", fields: [
              { label: "Time", name: "time", widget: "string" },
              { label: "Name (RU)", name: "name_ru", widget: "string" },
              { label: "Name (EN)", name: "name_en", widget: "string" }
            ]}

  - name: "announcements"
    label: "Announcements"
    folder: "_announcements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title (RU)", name: "title_ru", widget: "string" }
      - { label: "Title (EN)", name: "title_en", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Body (RU)", name: "body_ru", widget: "markdown" }
      - { label: "Body (EN)", name: "body_en", widget: "markdown" }
