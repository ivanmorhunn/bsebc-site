<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Славянская Евангельская Баптистская Церковь — г. Брукхейвен, Пенсильвания" />
  <title>BSEBC — Baptist Slavic Evangelical Baptist Church</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="content.js"></script>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a class="nav-brand" href="#hero">
    <img src="assets/logo.png" alt="BSEBC Logo" class="nav-logo-img" />
    <div class="brand-words">
      <strong id="nav-name"></strong>
      <span id="nav-tagline"></span>
    </div>
  </a>
  <ul class="nav-links" id="nav-links">
    <li><a href="#schedule" id="nl-schedule"></a></li>
    <li><a href="#archive"  id="nl-archive"></a></li>
    <li><a href="#about"    id="nl-about"></a></li>
    <li><a href="#gallery"  id="nl-gallery"></a></li>
    <li><a href="#donate"   id="nl-donate"></a></li>
    <li><a href="#contact"  id="nl-contact"></a></li>
  </ul>
  <div class="nav-right-group">
    <a class="nav-live" id="nav-live" href="#" target="_blank">
      <span class="live-dot"></span>
      <span id="nl-live"></span>
    </a>
    <div class="nav-lang">
      <button class="lang-btn active" data-lang="ru" onclick="setLang('ru')">РУ</button>
      <button class="lang-btn"        data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <button class="nav-hamburger" onclick="toggleMobile()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<nav class="nav-mobile" id="nav-mobile">
  <a href="#schedule" onclick="closeMobile()" id="nm-schedule"></a>
  <a href="#archive"  onclick="closeMobile()" id="nm-archive"></a>
  <a href="#about"    onclick="closeMobile()" id="nm-about"></a>
  <a href="#gallery"  onclick="closeMobile()" id="nm-gallery"></a>
  <a href="#donate"   onclick="closeMobile()" id="nm-donate"></a>
  <a href="#contact"  onclick="closeMobile()" id="nm-contact"></a>
  <a href="#" id="nm-live" target="_blank" class="nm-live-link"></a>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <div class="hero-eyebrow">
      <div class="eyebrow-line"></div>
      <span id="hero-eyebrow"></span>
    </div>
    <h1 id="hero-h1"></h1>
    <p class="hero-location" id="hero-location"></p>
    <p class="hero-verse" id="hero-verse"></p>
    <div class="hero-ctas">
      <a class="btn-primary" href="#schedule" id="hero-cta1"></a>
      <a class="btn-ghost"   href="#" id="hero-cta2" target="_blank"></a>
    </div>
  </div>
  <div class="hero-scroll">
    <div class="scroll-track"></div>
    <span id="hero-scroll-label"></span>
  </div>
</section>

<div class="gold-rule"></div>

<!-- SCHEDULE -->
<section id="schedule">
  <div class="sec-label"><span id="sch-label"></span></div>
  <h2 class="sec-title reveal" id="sch-heading"></h2>
  <div class="schedule-grid" id="schedule-grid"></div>
</section>

<div class="gold-rule"></div>

<!-- VERSE BANNER -->
<section id="verse">
  <svg class="verse-rings" viewBox="0 0 520 520" fill="none" preserveAspectRatio="xMidYMid meet">
    <circle cx="260" cy="260" r="250" stroke="#B8913A" stroke-width="0.7"/>
    <circle cx="260" cy="260" r="210" stroke="#B8913A" stroke-width="0.5" stroke-dasharray="4 10"/>
    <circle cx="260" cy="260" r="170" stroke="#B8913A" stroke-width="0.5"/>
  </svg>
  <blockquote class="reveal" id="verse-text"></blockquote>
  <p class="verse-ref" id="verse-ref"></p>
  <div class="orn-row">
    <div class="orn-line"></div>
    <div class="orn-diamond"></div>
    <div class="orn-line"></div>
  </div>
</section>

<!-- ARCHIVE -->
<section id="archive">
  <div class="sec-label"><span id="arc-label"></span></div>
  <h2 class="sec-title reveal" id="arc-heading"></h2>
  <div class="archive-grid reveal" id="archive-grid"></div>
</section>

<div class="gold-rule"></div>

<!-- ABOUT -->
<section id="about">
  <div class="about-left">
    <div class="sec-label"><span id="abt-label"></span></div>
    <h2 class="reveal" id="abt-heading"></h2>
    <p class="reveal" id="abt-body"></p>
    <a class="charter-link reveal" id="abt-charter" href="#" target="_blank">
      <span id="abt-charter-label"></span> →
    </a>
    <a class="btn-ghost reveal" href="#contact" id="abt-contact-btn" style="align-self:flex-start;margin-top:1rem"></a>
  </div>
  <div class="about-right">
    <h3 id="abt-beliefs-heading"></h3>
    <ul class="belief-list" id="belief-list"></ul>
  </div>
</section>

<!-- GALLERY -->
<section id="gallery">
  <div class="sec-label"><span id="gal-label"></span></div>
  <h2 class="sec-title reveal" id="gal-heading"></h2>
  <p class="gal-notice reveal" id="gal-notice"></p>
  <div class="gallery-grid reveal">
    <img class="gallery-img" src="assets/Picture1.png" alt="Church photo 1" onclick="openLightbox(this.src, this.alt)" />
    <img class="gallery-img" src="assets/Picture2.png" alt="Church photo 2" onclick="openLightbox(this.src, this.alt)" />
    <img class="gallery-img" src="assets/Picture3.png" alt="Church photo 3" onclick="openLightbox(this.src, this.alt)" />
    <img class="gallery-img" src="assets/Picture4.png" alt="Church photo 4" onclick="openLightbox(this.src, this.alt)" />
    <img class="gallery-img" src="assets/Picture5.JPG" alt="Church photo 5" onclick="openLightbox(this.src, this.alt)" />
    <div class="gallery-placeholder" onclick="openGallery()"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
    <div class="gallery-placeholder" onclick="openGallery()"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
    <div class="gallery-placeholder" onclick="openGallery()"><svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg></div>
  </div>
  <div class="gallery-cta reveal">
    <a class="btn-primary" id="gal-cta" href="#" target="_blank"></a>
  </div>
</section>

<div class="gold-rule"></div>

<!-- DONATE -->
<section id="donate">
  <div class="donate-left reveal">
    <div class="sec-label"><span id="don-label"></span></div>
    <h2 id="don-heading"></h2>
    <p id="don-body"></p>
    <a class="btn-dark" id="don-cta" href="#" target="_blank"></a>
  </div>
  <div class="donate-right reveal">
    <p id="don-verse"></p>
    <span id="don-verse-ref"></span>
  </div>
</section>

<div class="gold-rule"></div>

<!-- CONTACT -->
<section id="contact">
  <div class="contact-form-wrap">
    <div class="sec-label"><span id="con-label"></span></div>
    <h2 class="sec-title reveal" id="con-heading"></h2>
    <form class="contact-form reveal" onsubmit="handleSubmit(event)">
      <div class="form-field">
        <label id="con-name-label"></label>
        <input type="text" id="con-name-input" required />
      </div>
      <div class="form-field">
        <label id="con-email-label"></label>
        <input type="email" id="con-email-input" required />
      </div>
      <div class="form-field">
        <label id="con-msg-label"></label>
        <textarea id="con-msg-input" required></textarea>
      </div>
      <button type="submit" class="btn-dark" id="con-send"></button>
    </form>
  </div>
  <div class="contact-map-wrap reveal">
    <div class="sec-label" style="margin-bottom:1rem"><span id="con-map-label"></span></div>
    <div class="map-wrap">
      <iframe
        src="https://www.google.com/maps?q=415+Edwards+Dr,+Brookhaven,+PA+19015&output=embed"
        allowfullscreen loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="BSEBC Church Location — 415 Edwards Dr, Brookhaven PA">
      </iframe>
    </div>
    <p class="map-address">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      <span>415 Edwards Dr, Brookhaven, PA 19015</span>
    </p>
    <a class="directions-link"
       href="https://maps.google.com/?q=415+Edwards+Dr,+Brookhaven,+PA+19015"
       target="_blank" id="con-directions"></a>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="footer-top">
    <div class="f-brand">
      <div class="f-brand-name">
        <img src="assets/logo.png" alt="BSEBC Logo" class="ft-logo-img" />
        <span id="ft-name"></span>
      </div>
      <p id="ft-tagline"></p>
    </div>
    <div class="f-col">
      <h5 id="ft-nav-col"></h5>
      <a href="#hero"     id="ft-home"></a>
      <a href="#schedule" id="ft-schedule"></a>
      <a href="#about"    id="ft-about"></a>
      <a href="#contact"  id="ft-contact"></a>
    </div>
    <div class="f-col">
      <h5 id="ft-arc-col"></h5>
      <a id="ft-audio"  href="https://soundcloud.com/bsebc/sets" target="_blank"></a>
      <a id="ft-video"  href="https://www.youtube.com/channel/UCgAOqEYimhA21nN2zQkOcYQ/videos" target="_blank">YouTube</a>
      <a id="ft-vimeo"  href="https://vimeo.com/bsebc" target="_blank">Vimeo</a>
      <a id="ft-photos" href="http://bsebc.zenfolio.com/f781568629" target="_blank"></a>
    </div>
    <div class="f-col">
      <h5 id="ft-con-col"></h5>
      <a href="#contact" id="ft-write"></a>
      <a href="#donate"  id="ft-give"></a>
      <a id="ft-live" href="https://www.youtube.com/channel/UCgAOqEYimhA21nN2zQkOcYQ/live" target="_blank"></a>
    </div>
  </div>
  <div class="footer-bottom">
    <p id="ft-copy"></p>
    <p id="ft-year"></p>
    <p id="ft-rights"></p>
  </div>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-backdrop" onclick="closeLightbox()"></div>
  <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Photo preview">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">×</button>
    <img id="lightbox-img" class="lightbox-img" alt="" />
    <div class="lightbox-actions">
      <a class="btn-primary" id="lightbox-open-archive" href="#" target="_blank" rel="noreferrer"></a>
    </div>
  </div>
</div>

<script>
let lang = 'ru';
function t(obj){ return (obj&&obj[lang])||(obj&&obj['ru'])||''; }

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === l));
  document.documentElement.lang = l==='ru'?'ru':'en';
  render();
}

function render() {
  const C=CONTENT, s=C.site;
  // NAV
  document.getElementById('nav-name').textContent    = t(s.name);
  document.getElementById('nav-tagline').textContent = t(s.tagline);
  document.getElementById('nl-schedule').textContent = t(C.nav.schedule);
  document.getElementById('nl-archive').textContent  = t(C.nav.archive);
  document.getElementById('nl-about').textContent    = t(C.nav.about);
  document.getElementById('nl-gallery').textContent  = t(C.nav.gallery);
  document.getElementById('nl-donate').textContent   = t(C.nav.donate);
  document.getElementById('nl-contact').textContent  = t(C.nav.contact);
  document.getElementById('nl-live').textContent     = t(C.nav.live);
  document.getElementById('nav-live').href           = s.youtubeLive;
  document.getElementById('nm-schedule').textContent = t(C.nav.schedule);
  document.getElementById('nm-archive').textContent  = t(C.nav.archive);
  document.getElementById('nm-about').textContent    = t(C.nav.about);
  document.getElementById('nm-gallery').textContent  = t(C.nav.gallery);
  document.getElementById('nm-donate').textContent   = t(C.nav.donate);
  document.getElementById('nm-contact').textContent  = t(C.nav.contact);
  document.getElementById('nm-live').textContent     = '▶ ' + t(C.nav.live);
  document.getElementById('nm-live').href            = s.youtubeLive;

  // HERO
  document.getElementById('hero-eyebrow').textContent  = t(s.tagline);
  document.getElementById('hero-h1').textContent       = t(C.hero.heading);
  document.getElementById('hero-location').textContent = t(s.location);
  document.getElementById('hero-verse').textContent    = t(C.hero.verse);
  document.getElementById('hero-cta1').textContent     = t(C.hero.cta1);
  document.getElementById('hero-cta2').textContent     = t(C.hero.cta2);
  document.getElementById('hero-cta2').href            = s.youtubeLive;
  document.getElementById('hero-scroll-label').textContent = lang==='ru'?'Прокрутить вниз':'Scroll down';

  // SCHEDULE
  document.getElementById('sch-label').textContent   = t(C.schedule.label);
  document.getElementById('sch-heading').textContent = t(C.schedule.heading);
  const grid = document.getElementById('schedule-grid');
  grid.innerHTML = '';
  C.schedule.days.forEach((day,i) => {
    if(i>0){const d=document.createElement('div');d.className='sched-divider';grid.appendChild(d);}
    const block=document.createElement('div');
    block.className='day-block reveal';
    block.innerHTML=`<div class="day-header"><div class="day-num">0${i+1}</div><div><div class="day-name">${t(day.name)}</div><div class="day-en">${lang==='ru'?(day.name.en||''):(day.name.ru||'')}</div></div></div>${day.services.map(sv=>`<div class="service-row"><span class="s-name">${t(sv.name)}</span><span class="s-time">${sv.time}</span></div>`).join('')}`;
    grid.appendChild(block);
  });

  // VERSE
  document.getElementById('verse-text').textContent = '\u00AB'+t(C.verseBanner.text)+'\u00BB';
  document.getElementById('verse-ref').textContent  = t(C.verseBanner.ref);

  // ARCHIVE
  document.getElementById('arc-label').textContent   = t(C.archive.label);
  document.getElementById('arc-heading').textContent = t(C.archive.heading);
  const ag=document.getElementById('archive-grid');
  ag.innerHTML='';
  C.archive.items.forEach(item=>{
    const a=document.createElement('a');
    a.className='archive-card';a.href=item.url;a.target='_blank';
    a.innerHTML=`<div class="ac-ring">${getIcon(item.icon)}</div><div class="ac-title">${t(item.title)}</div><div class="ac-sub">${t(item.sub)}</div><span class="ac-arrow">↗</span>`;
    ag.appendChild(a);
  });

  // ABOUT
  document.getElementById('abt-label').textContent           = t(C.about.label);
  document.getElementById('abt-heading').innerHTML           = t(C.about.heading).replace('\n','<br>');
  document.getElementById('abt-body').textContent            = t(C.about.body);
  document.getElementById('abt-charter').href               = s.charter;
  document.getElementById('abt-charter-label').textContent   = t(C.about.charterLabel);
  document.getElementById('abt-contact-btn').textContent    = t(C.nav.contact);
  document.getElementById('abt-beliefs-heading').textContent = t(C.about.beliefs.heading);
  const bl=document.getElementById('belief-list');
  bl.innerHTML='';
  ['I','II','III','IV','V'].forEach((r,i)=>{
    if(!C.about.beliefs.items[i]) return;
    const li=document.createElement('li');
    li.className='belief-item';
    li.innerHTML=`<span class="belief-num">${r}</span><span class="belief-text">${t(C.about.beliefs.items[i])}</span>`;
    bl.appendChild(li);
  });

  // GALLERY
  document.getElementById('gal-label').textContent   = t(C.nav.gallery);
  document.getElementById('gal-heading').textContent = lang==='ru'?'Фотогалерея':'Photo Gallery';
  document.getElementById('gal-notice').textContent  = lang==='ru'
    ? 'Фотографии хранятся на Zenfolio — нажмите, чтобы открыть архив.'
    : 'Photos are hosted on Zenfolio — click any tile to open the archive.';
  document.getElementById('gal-cta').textContent = lang==='ru'?'Открыть фотоархив →':'Open photo archive →';
  document.getElementById('gal-cta').href = s.photos;
  document.getElementById('lightbox-open-archive').textContent = lang==='ru'?'Открыть фотоархив →':'Open photo archive →';

  // DONATE
  document.getElementById('don-label').textContent   = t(C.donate.label);
  document.getElementById('don-heading').textContent = t(C.donate.heading);
  document.getElementById('don-body').textContent    = t(C.donate.body);
  document.getElementById('don-cta').textContent     = t(C.donate.cta);
  document.getElementById('don-cta').href            = s.venmo;
  document.getElementById('don-verse').textContent   = '\u00AB'+t(C.donate.sideVerse)+'\u00BB';
  document.getElementById('don-verse-ref').textContent = t(C.donate.sideVerseRef);

  // CONTACT
  document.getElementById('con-label').textContent       = t(C.contact.label);
  document.getElementById('con-heading').textContent     = t(C.contact.heading);
  document.getElementById('con-name-label').textContent  = t(C.contact.emailPlaceholder.name);
  document.getElementById('con-name-input').placeholder  = t(C.contact.emailPlaceholder.name);
  document.getElementById('con-email-label').textContent = t(C.contact.emailPlaceholder.email);
  document.getElementById('con-email-input').placeholder = t(C.contact.emailPlaceholder.email);
  document.getElementById('con-msg-label').textContent   = t(C.contact.emailPlaceholder.message);
  document.getElementById('con-msg-input').placeholder   = t(C.contact.emailPlaceholder.message);
  document.getElementById('con-send').textContent        = t(C.contact.emailPlaceholder.send);
  document.getElementById('con-map-label').textContent   = lang==='ru'?'Как нас найти':'Find Us';
  document.getElementById('con-directions').textContent  = lang==='ru'?'Открыть в Google Maps →':'Get Directions →';

  // FOOTER
  document.getElementById('ft-name').textContent     = t(s.name);
  document.getElementById('ft-tagline').textContent  = t(C.footer.tagline);
  document.getElementById('ft-nav-col').textContent  = t(C.footer.cols.nav);
  document.getElementById('ft-arc-col').textContent  = t(C.footer.cols.archive);
  document.getElementById('ft-con-col').textContent  = t(C.footer.cols.connect);
  document.getElementById('ft-home').textContent     = t(C.nav.home);
  document.getElementById('ft-schedule').textContent = t(C.nav.schedule);
  document.getElementById('ft-about').textContent    = t(C.nav.about);
  document.getElementById('ft-contact').textContent  = t(C.nav.contact);
  document.getElementById('ft-audio').textContent    = lang==='ru'?'Аудио':'Audio';
  document.getElementById('ft-photos').textContent   = lang==='ru'?'Фотогалерея':'Photos';
  document.getElementById('ft-write').textContent    = t(C.nav.contact);
  document.getElementById('ft-give').textContent     = t(C.nav.donate);
  document.getElementById('ft-live').textContent     = t(C.nav.live);
  document.getElementById('ft-copy').textContent     = '© BSEBC';
  document.getElementById('ft-year').textContent     = String(new Date().getFullYear());
  document.getElementById('ft-rights').textContent   = t(C.footer.copyright);

  observeReveals();
}

function getIcon(type){
  const icons={
    audio:'<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>',
    book:'<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 15H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>',
    youtube:'<svg viewBox="0 0 24 24"><path d="M21.58 7.19c-.23-.86-.91-1.54-1.77-1.77C18.25 5 12 5 12 5s-6.25 0-7.81.42c-.86.23-1.54.91-1.77 1.77C2 8.75 2 12 2 12s0 3.25.42 4.81c.23.86.91 1.54 1.77 1.77C5.75 19 12 19 12 19s6.25 0 7.81-.42c.86-.23 1.54-.91 1.77-1.77C22 15.25 22 12 22 12s0-3.25-.42-4.81zM10 15V9l5.2 3-5.2 3z"/></svg>',
    video:'<svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
    choir:'<img class="ac-icon-img" src="assets/choir.png" alt="" loading="lazy" />',
    photo:'<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>',
  };
  return icons[type]||icons.audio;
}

window.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',window.scrollY>60));
window.addEventListener('load',()=>{
  const bg=document.getElementById('hero-bg');
  bg.style.backgroundImage="url('assets/church.webp')";
  setTimeout(()=>bg.classList.add('loaded'),100);
});
function toggleMobile(){document.getElementById('nav-mobile').classList.toggle('open');}
function closeMobile(){document.getElementById('nav-mobile').classList.remove('open');}
function openGallery(){window.open(CONTENT.site.photos,'_blank');}
function openLightbox(src, alt){
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  const open = document.getElementById('lightbox-open-archive');
  img.src = src;
  img.alt = alt || '';
  open.href = CONTENT.site.photos;
  lb.setAttribute('aria-hidden','false');
  document.body.classList.add('no-scroll');
  // Ensure CSS transitions fire (avoid display:none -> block timing issues)
  requestAnimationFrame(() => lb.classList.add('open'));
}
function closeLightbox(){
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  lb.setAttribute('aria-hidden','true');
  document.body.classList.remove('no-scroll');
  img.src = '';
  lb.classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const lb = document.getElementById('lightbox');
  if (!lb || lb.getAttribute('aria-hidden') === 'true') return;
  closeLightbox();
});
function observeReveals(){
  const obs=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('visible');obs.unobserve(x.target);}}),{threshold:0.1});
  document.querySelectorAll('.reveal:not(.visible)').forEach(el=>obs.observe(el));
}
function handleSubmit(e){
  e.preventDefault();
  const btn=document.getElementById('con-send');
  btn.textContent=lang==='ru'?'Отправлено ✓':'Sent ✓';
  btn.style.background='#2a6e3f';
  setTimeout(()=>{btn.textContent=lang==='ru'?'Отправить':'Send';btn.style.background='';},3000);
}
render();
observeReveals();
</script>
