<script>
let lang = localStorage.getItem('bsebc-lang') || 'ru';
function t(obj){ return (obj&&obj[lang])||(obj&&obj['ru'])||''; }

// Page transition (fade between HTML pages)
document.body.classList.add('page-enter');
window.addEventListener('pageshow', () => {
  requestAnimationFrame(() => document.body.classList.remove('page-enter'));
});
document.addEventListener('click', (e) => {
  const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
  if (!a) return;
  const href = a.getAttribute('href') || '';
  if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
  if (a.target && a.target !== '_self') return;
  const url = new URL(a.href, window.location.href);
  if (url.origin !== window.location.origin) return;
  if (url.pathname === window.location.pathname && url.search === window.location.search && url.hash) return;
  e.preventDefault();
  document.body.classList.add('page-leave');
  window.setTimeout(() => { window.location.href = url.href; }, 180);
});

function setLang(l) {
  if (lang === l) return;
  if (document.body.classList.contains('lang-switching')) return;

  normalizeLetterSwap();
  const before = snapshotSimpleText();
  document.body.classList.add('lang-switching','lang-lettering');
  window.setTimeout(() => {
    lang = l;
    localStorage.setItem('bsebc-lang', l);
    document.querySelectorAll('.lang-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === l));
    const langWrap = document.querySelector('.nav-lang');
    if (langWrap) langWrap.classList.toggle('is-en', l === 'en');
    document.documentElement.lang = l==='ru'?'ru':'en';
    render();
    animateTextDiff(before);
    window.setTimeout(() => {
      document.body.classList.remove('lang-switching','lang-lettering');
    }, 320);
  }, 110);
}

function normalizeLetterSwap() {
  // Ensure previous animation doesn't prevent future snapshots (e.g. EN -> RU)
  document.querySelectorAll('.letter-swap').forEach(el => {
    const plain = el.getAttribute('data-plain-text') || (el.textContent || '');
    el.classList.remove('letter-swap','is-in','is-out');
    el.removeAttribute('data-plain-text');
    el.style.removeProperty('minWidth');
    el.textContent = plain;
  });
}

function snapshotSimpleText() {
  // Only animate plain-text elements (no child elements) to avoid breaking layouts.
  const out = new Map();
  document.querySelectorAll('[id]').forEach(el => {
    if (!(el instanceof HTMLElement)) return;
    if (el.children && el.children.length) return;
    const txt = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!txt) return;
    // Skip numerals + tiny tokens that look weird per-letter
    if (txt.length < 3) return;
    out.set(el.id, txt);
  });
  return out;
}

function animateTextDiff(before) {
  if (!before || typeof before.get !== 'function') return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  before.forEach((oldTxt, id) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.children && el.children.length) return;
    const newTxt = (el.textContent || '').replace(/\s+/g, ' ').trim();
    if (!newTxt || newTxt === oldTxt) return;
    // Avoid animating long paragraphs; keep it crisp.
    if (newTxt.length > 140 || oldTxt.length > 140) return;
    // Performance: only animate elements currently visible.
    if (!isInViewport(el, 120)) return;
    letterMorph(el, oldTxt, newTxt);
  });
}

function isInViewport(el, pad = 0) {
  const r = el.getBoundingClientRect();
  const vh = window.innerHeight || document.documentElement.clientHeight || 0;
  return r.bottom >= -pad && r.top <= vh + pad;
}

function letterMorph(el, oldText, newText) {
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    el.textContent = newText;
    return;
  }

  const oldLetters = Array.from(String(oldText));
  const newLetters = Array.from(String(newText));

  // Keep layout stable while letters fly around
  const w = el.getBoundingClientRect().width;
  if (w) el.style.minWidth = `${Math.ceil(w)}px`;

  el.classList.add('letter-swap');
  el.setAttribute('data-plain-text', String(newText));

  const makeLetter = (ch) => {
    const s = document.createElement('span');
    s.className = 'letter';
    s.innerHTML = escapeHtml(ch);
    // Random-ish fly vectors
    const dx = (Math.random() * 26 - 13).toFixed(1);
    const dy = (Math.random() * 22 - 18).toFixed(1);
    const rot = (Math.random() * 28 - 14).toFixed(1);
    s.style.setProperty('--dx', `${dx}px`);
    s.style.setProperty('--dy', `${dy}px`);
    s.style.setProperty('--rot', `${rot}deg`);
    return s;
  };

  const renderWords = (text) => {
    el.innerHTML = '';
    const frag = document.createDocumentFragment();
    const letters = [];
    const parts = String(text).split(/(\s+)/);
    let letterIdx = 0;
    parts.forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) {
        frag.appendChild(document.createTextNode(part));
        return;
      }
      const word = document.createElement('span');
      word.className = 'letter-word';
      Array.from(part).forEach(ch => {
        const letter = makeLetter(ch === ' ' ? '\u00A0' : ch);
        word.appendChild(letter);
        letter.style.transitionDelay = `${Math.min(260, letterIdx * 12)}ms`;
        letters.push(letter);
        letterIdx++;
      });
      frag.appendChild(word);
    });
    el.appendChild(frag);
    return letters;
  };

  // Out: render old text (word-grouped so no mid-word wrapping)
  const outLetters = renderWords(oldText);
  outLetters.forEach((s, i) => {
    s.style.transitionDelay = `${Math.min(160, i * 8)}ms`;
  });

  requestAnimationFrame(() => {
    el.classList.remove('is-in');
    el.classList.add('is-out');
  });

  // Swap to new letters and fly-in
  window.setTimeout(() => {
    el.classList.remove('is-out');
    const inSpans = renderWords(newText);
    inSpans.forEach((s) => {
      // start slightly "broken apart" then settle
      s.style.opacity = '0';
      s.style.transform = 'translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.96)';
      s.style.filter = 'blur(3px)';
    });

    // Two frames ensures the browser commits "from" styles before animating "to"
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.classList.add('is-in');
      inSpans.forEach(s => {
        s.style.opacity = '1';
        s.style.transform = 'translate(0px, 0px) rotate(0deg) scale(1)';
        s.style.filter = 'blur(0px)';
      });
    }));

    // Cleanup back to plain text so the next toggle (back to RU) can animate too
    window.setTimeout(() => {
      el.classList.remove('letter-swap','is-in','is-out');
      el.style.removeProperty('minWidth');
      el.textContent = String(newText);
      el.removeAttribute('data-plain-text');
    }, 900);
  }, 240);
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function render() {
  const C=CONTENT, s=C.site;
  // NAV
  document.getElementById('nav-name').textContent    = t(s.name);
  document.getElementById('nav-tagline').textContent = t(s.tagline);
  document.getElementById('nl-schedule').textContent = t(C.nav.schedule);
  document.getElementById('nl-archive').textContent  = t(C.nav.archive);
  document.getElementById('nl-about').textContent    = t(C.nav.about);
  document.getElementById('nl-gallery').textContent  = t(C.nav.homeGallery);
  document.getElementById('nl-donate').textContent   = t(C.nav.donate);
  document.getElementById('nl-contact').textContent  = t(C.nav.contact);
  document.getElementById('nl-gallery-page').textContent = t(C.nav.gallery);
  document.getElementById('nl-live').textContent     = t(C.nav.live);
  document.getElementById('nav-live').href           = s.youtubeLive;
  document.getElementById('nm-schedule').textContent = t(C.nav.schedule);
  document.getElementById('nm-archive').textContent  = t(C.nav.archive);
  document.getElementById('nm-about').textContent    = t(C.nav.about);
  document.getElementById('nm-gallery').textContent  = t(C.nav.homeGallery);
  document.getElementById('nm-donate').textContent   = t(C.nav.donate);
  document.getElementById('nm-contact').textContent  = t(C.nav.contact);
  document.getElementById('nm-gallery-page').textContent = t(C.nav.gallery);
  document.getElementById('nm-live').textContent     = '▶ ' + t(C.nav.live);
  document.getElementById('nm-live').href            = s.youtubeLive;

let galleryLightboxItems = [];
let lightboxIndex = -1;

function refreshGalleryLightboxItems() {
  galleryLightboxItems = Array.from(document.querySelectorAll('.gallery-grid .gallery-img'))
    .map(img => ({ src: img.getAttribute('src') || '', alt: img.getAttribute('alt') || '' }))
    .filter(x => x.src);
}

function resolveLightboxIndex(src, preferredIndex) {
  if (typeof preferredIndex === 'number' && Number.isFinite(preferredIndex)) return preferredIndex;
  const idx = galleryLightboxItems.findIndex(x => x.src === src);
  return idx >= 0 ? idx : 0;
}

function updateLightboxNavUi() {
  const prev = document.querySelector('.lightbox-prev');
  const next = document.querySelector('.lightbox-next');
  const count = galleryLightboxItems.length;
  const disable = count <= 1;
  if (prev) prev.disabled = disable;
  if (next) next.disabled = disable;
}

function showLightboxAt(index) {
  if (!galleryLightboxItems.length) refreshGalleryLightboxItems();
  if (!galleryLightboxItems.length) return;

  const count = galleryLightboxItems.length;
  const nextIndex = ((index % count) + count) % count;
  lightboxIndex = nextIndex;

  const img = document.getElementById('lightbox-img');
  const item = galleryLightboxItems[nextIndex];
  if (!img || !item) return;

  // Instant swap (no dimming / transition)
  img.src = item.src;
  img.alt = item.alt || '';
}

function openLightbox(src, alt, startIndex){
  refreshGalleryLightboxItems();
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  const open = document.getElementById('lightbox-open-archive');
  lightboxIndex = resolveLightboxIndex(src, startIndex);
  const item = galleryLightboxItems[lightboxIndex] || { src, alt: alt || '' };
  img.src = item.src;
  img.alt = item.alt || alt || '';
  open.href = CONTENT.site.photos;
  updateLightboxNavUi();
  lb.setAttribute('aria-hidden','false');
  document.body.classList.add('no-scroll');
  // Ensure CSS transitions fire (avoid display:none -> block timing issues)
  requestAnimationFrame(() => lb.classList.add('open'));
}
function closeLightbox(){
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  lb.setAttribute('aria-hidden','true');
  document.body.classList.remove('no-scroll');
  img.src = '';
  lb.classList.remove('open');
  lightboxIndex = -1;
}

function lightboxPrev() {
  if (!galleryLightboxItems.length) refreshGalleryLightboxItems();
  if (galleryLightboxItems.length <= 1) return;
  showLightboxAt(lightboxIndex - 1);
  updateLightboxNavUi();
}

function lightboxNext() {
  if (!galleryLightboxItems.length) refreshGalleryLightboxItems();
  if (galleryLightboxItems.length <= 1) return;
  showLightboxAt(lightboxIndex + 1);
  updateLightboxNavUi();
}

document.addEventListener('keydown', (e) => {
  const lb = document.getElementById('lightbox');
  if (!lb || lb.getAttribute('aria-hidden') === 'true') return;

  if (e.key === 'Escape') {
    closeLightbox();
    return;
  }

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    lightboxPrev();
    return;
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    lightboxNext();
    return;
  }
});
function observeReveals(){
  const obs=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('visible');obs.unobserve(x.target);}}),{threshold:0.1});
  document.querySelectorAll('.reveal:not(.visible)').forEach(el=>obs.observe(el));
}
